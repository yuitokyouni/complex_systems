name: Publish Quarto site

on:
  push:
    branches:
      - main
      - claude/lucid-hamilton-17hkv1
  workflow_dispatch:

permissions:
  contents: write   # gh-pages ブランチへの push に必要

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # execute: enabled: false なので重い再計算はしない。
      # ノートブックの埋め込み出力の読み取りに必要な最小限のみ入れる。
      - name: Install Python deps
        run: pip install jupyter nbformat

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      # peaceiris/actions-gh-pages は gh-pages ブランチが無ければ自動で作成する。
      # quarto publish gh-pages のような「事前にブランチを作れ」制約が無い。
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
